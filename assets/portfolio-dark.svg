<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="Portfolio: take a look at my work at miguel-cruz-dev.netlify.app"><title>Portfolio: take a look at my work at miguel-cruz-dev.netlify.app</title><style>@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}

.eyebrow{font-family:'Inter';font-weight:600;font-size:14px;letter-spacing:2.5px;fill:#1F1F1F;opacity:.7}
.big{font-family:'Inter';font-weight:800;font-size:34px;letter-spacing:-1px;fill:#1F1F1F}
.arrow{animation:nudge 2.4s cubic-bezier(.22,1,.36,1) infinite}
@keyframes nudge{0%,55%,100%{transform:translate(0,0)}25%{transform:translate(4px,-4px)}}
</style>
<defs><clipPath id="clip"><rect width="1000" height="140" rx="24"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1F1F1F" opacity=".12"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="m"><rect width="1000" height="140" fill="url(#fade)"/></mask></defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="140" fill="#FF8B52"/>
  <rect width="1000" height="140" fill="url(#dots)" mask="url(#m)"/>
</g>
<text class="eyebrow" x="48" y="56">PORTFOLIO</text>
<text class="big" x="46" y="98">Take a look at my work</text>
<g class="btn">
  <circle cx="912" cy="70.0" r="38" fill="#1F1F1F"/>
  <g class="arrow"><g transform="translate(898 56.0) scale(1.1666666666666667)" fill="none" stroke="#FF8B52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><!-- @license lucide-static v1.59.0 - ISC -->

  <path d="M7 7h10v10" />
  <path d="M7 17 17 7" /></g></g>
</g></svg>
