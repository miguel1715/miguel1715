.code{font-family:'Mono';font-size:15px;white-space:pre}
.k{fill:#f46e2a} .p{fill:#1F1F1F;font-weight:400} .t{fill:#1F1F1F} .m{fill:rgba(31,31,31,.62)}
.s{fill:#1F1F1F;opacity:.75}
.file{font-family:'Mono';font-size:13px;fill:rgba(31,31,31,.62)}
.cursor{fill:#f46e2a;animation:in .1s linear 2.9s both, blink 1.1s step-end 3s infinite}
.orb{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,60px)}}
</style>
