<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Miguel Cruz, self-taught web developer from Portugal, learning JavaScript"><title>Miguel Cruz, self-taught web developer from Portugal, learning JavaScript</title><style>@font-face{font-family:'Inter';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
